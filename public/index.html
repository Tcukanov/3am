<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Old+Standard+TT:wght@400;700&family=PT+Mono&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: the windshield fills the screen; controls sit low like labelled dash switches. */
:root{
  --night:#05070d; --ink:#e9e2cf; --dim:#8d8a7d;
  --amber:#e8a33d; --tape:#14131a; --tape-ink:#f1eee4; --hot:#a82a1e;
  --sign:#0e5a3c; --paper:#d8cfb6; --paper-ink:#1d1a14; --paper-rule:#3a3428;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --mono:"PT Mono","Courier New",monospace;
  --serif:"PT Serif",Georgia,serif;
  --news:"Old Standard TT","Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:default}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* Embossed label-maker tape: the driver labelled his own switches. */
.tape{font-family:var(--mono);font-weight:400;text-transform:uppercase;letter-spacing:.14em;font-size:12px;
  background:var(--tape);color:var(--tape-ink);padding:7px 11px;border-radius:2px;
  box-shadow:inset 0 1px 0 #34323d,inset 0 -1px 0 #000,0 2px 5px #000a;
  text-shadow:0 1px 0 #000;white-space:nowrap}
button.tape:hover{background:#25232d}
button.tape:active{transform:translateY(1px)}
button.tape:disabled{opacity:.35;cursor:default}
button.tape.on{color:var(--amber)}
button.tape.red{background:var(--hot)}
button.tape.red:hover{background:#c23526}
button.tape.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 1px 0 #34323d,0 0 16px var(--amber)}}

#hud{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud>*{pointer-events:auto}
#top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;pointer-events:none}
#status{display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
#status .tape{font-variant-numeric:tabular-nums}
#mode{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;max-width:44ch}

#low{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;pointer-events:none}
#subs{max-width:64ch;width:100%;text-align:center;font-family:var(--serif);min-height:4.2em;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;pointer-events:none}
#subs .you{color:var(--dim);font-size:14px}
#subs .them{font-size:clamp(18px,2.4vw,23px);line-height:1.3;text-shadow:0 1px 3px #000,0 0 14px #000}
#subs .them.other{color:#f0c98a}
#subs .nar{font-style:italic;color:#c8c2ad;font-size:clamp(15px,1.9vw,18px);line-height:1.4;text-shadow:0 1px 3px #000,0 0 12px #000}
#subs .quiet{color:var(--dim);font-style:italic;font-size:15px}
#choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
#choices .tape{font-size:13px;padding:10px 14px;background:#2b1a07;color:var(--amber);box-shadow:inset 0 1px 0 #5a3a12,0 0 14px #e8a33d44}
#choices .tape:hover{background:#3d2509}
#talk{display:flex;gap:8px;width:min(720px,100%);pointer-events:auto}
#say{flex:1;min-width:0;background:#0b0c12e6;border:1px solid #2c2b33;border-radius:2px;color:var(--ink);font-family:var(--serif);font-size:16px;padding:10px 12px}
#say::placeholder{color:#74716a}
#say:disabled{opacity:.45}
#dash{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
#hud[data-mode="off"] #low,#hud[data-mode="off"] #top{visibility:hidden}
#talk[hidden],#dash[hidden]{display:none}

#mirrorNote{position:fixed;left:50%;top:62%;transform:translateX(-50%);font-family:var(--mono);font-size:14px;color:#d8d2bd;background:#000a;padding:6px 12px;max-width:min(60ch,90vw);text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
#mirrorNote.show{opacity:1}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
#fade.solid{opacity:1;pointer-events:auto}
#card{font-family:var(--display);letter-spacing:.06em;font-size:clamp(20px,3.4vw,34px);color:var(--ink);text-transform:uppercase;white-space:pre-line;line-height:1.35}
#card small{display:block;font-family:var(--serif);text-transform:none;letter-spacing:0;font-size:clamp(15px,1.8vw,18px);color:var(--dim);margin-top:12px;font-style:italic;white-space:pre-line}

#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:22px;text-align:center;overflow:auto;box-sizing:border-box;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 42%,#0000 20%,#000c 90%)}
.hwy{background:var(--sign);color:#f5f3ea;border-radius:12px;padding:6px;box-shadow:0 0 60px #cfe8d622,0 8px 24px #000}
.hwy>div{border:3px solid #f5f3ea;border-radius:8px;padding:14px clamp(20px,5vw,52px) 16px}
.hwy h1{font-family:var(--display);font-weight:600;font-size:clamp(38px,8.5vw,92px);letter-spacing:.03em;margin:0;line-height:1;text-wrap:balance}
.hwy p{font-family:var(--display);font-size:clamp(15px,2.2vw,22px);margin:8px 0 0;letter-spacing:.08em;display:flex;justify-content:space-between;gap:24px}
#pitch{font-family:var(--serif);max-width:52ch;font-size:clamp(15px,1.9vw,18px);line-height:1.5;margin:0;text-shadow:0 1px 4px #000;text-wrap:balance}
#bank{font-size:13px;color:var(--amber)}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;width:min(1040px,100%);margin:0;padding:0;list-style:none;text-align:left}
#cards li{background:var(--paper);color:var(--paper-ink);padding:12px 14px 14px;box-shadow:0 3px 14px #000a;min-width:0;
  background-image:repeating-linear-gradient(0deg,#0000 0 3px,#00000006 3px 4px)}
#cards h2{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;line-height:1.15;margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
#cards h2 span{font-family:var(--mono);font-weight:400;font-size:11px;color:#6b1d12}
#cards p{font-family:var(--serif);font-size:15px;line-height:1.38;margin:0}
#titleBtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
#go{font-size:15px;padding:12px 22px}
#codeWrap{font-family:var(--mono);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
#code{background:#0b0c12e6;border:1px solid #2c2b33;border-radius:2px;color:var(--ink);font-family:var(--mono);font-size:16px;padding:8px 10px;width:min(240px,70vw)}
#codeErr{font-family:var(--mono);font-size:13px;color:#ff9a7a;margin:0}
#fine{font-family:var(--mono);font-size:11px;color:var(--dim);max-width:62ch;line-height:1.5;margin:0}

#paper{position:fixed;inset:0;overflow:auto;background:#000;display:flex;justify-content:center;padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#sheet{background:var(--paper);color:var(--paper-ink);width:min(860px,100%);padding:clamp(16px,3vw,34px);box-shadow:0 0 50px #000;align-self:flex-start;font-family:var(--news);box-sizing:border-box;
  background-image:repeating-linear-gradient(0deg,#0000 0 3px,#00000006 3px 4px)}
#mast{text-align:center;border-bottom:3px double var(--paper-rule);padding-bottom:8px}
#mast h2{font-size:clamp(32px,7vw,62px);margin:0;font-weight:700;line-height:1.05}
#mast div{display:flex;justify-content:space-between;gap:12px;font-size:13px;border-top:1px solid var(--paper-rule);margin-top:8px;padding-top:4px;flex-wrap:wrap}
#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 22px;margin-top:14px}
.item{min-width:0;border-bottom:1px solid var(--paper-rule);padding-block:10px}
.item .when{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6b1d12;margin-bottom:5px}
.item h3{font-size:clamp(20px,2.6vw,25px);line-height:1.12;margin:0 0 6px;font-weight:700;text-wrap:balance}
.item p{margin:0;font-size:16px;line-height:1.38;font-family:var(--serif)}
.item.late{grid-column:1/-1;background:#00000010;padding-inline:12px}
#ledger{font-family:var(--serif);font-size:clamp(17px,2.2vw,21px);line-height:1.35;text-align:center;padding:12px 0;border-bottom:1px solid var(--paper-rule);text-wrap:balance}
#ledger b{display:block;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(24px,4vw,36px);line-height:1.1;margin-bottom:4px}
#paperWait{font-family:var(--serif);font-style:italic;text-align:center;padding:50px 0;font-size:18px}
#ads{font-size:13px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:3px double var(--paper-rule);margin-top:12px;padding-top:7px}
#fict{font-family:var(--mono);font-size:11px;line-height:1.5;margin:12px 0 0;color:#4a4436}
#again{margin-top:14px;display:flex;justify-content:center}
@media (prefers-reduced-motion:reduce){button.tape.pulse{animation:none}}
</style>

<canvas id="gl" aria-label="View through the windshield of a car at night, with the rear-view mirror at the top"></canvas>

<div id="hud" data-mode="off">
  <div id="top">
    <div id="status"><span class="tape" id="clock"></span><span class="tape" id="dest"></span><span class="tape" id="mph"></span><span class="tape" id="cash"></span><span class="tape" id="fuel"></span></div>

  <div id="low">

    <form id="talk" hidden>
      <input id="say" autocomplete="off" maxlength="160">

    <div id="dash" hidden>

      <button class="tape" id="bSlow" type="button"></button>

      <button class="tape" id="bStop" type="button"></button>

  </div>
</div>
<div id="mirrorNote"></div>
<div id="fade"><div id="card"></div></div>

<div id="title">
  <div class="hwy"><div><h1>LAST RIDE 3AM</h1><p><span>ODESSA 40</span><span>LUBBOCK 137</span></p></div></div>
  <p id="pitch"></p>
  <span class="tape" id="bank"></span>
  <div id="titleBtns">
    <button class="tape" id="lEn" type="button">English</button>
    <button class="tape" id="lRu" type="button">Русский</button>
    <button class="tape red" id="go" type="button"></button>
  </div>
  <ol id="cards"></ol>
  <label id="codeWrap" hidden><span id="codeLabel"></span> <input id="code" autocomplete="off" spellcheck="false"></label>

</div>

<div id="paper" hidden>
  <div id="sheet">

    <div id="items"></div>
    <div id="ads"><span id="ad1"></span><span id="ad2"></span><span id="ad3"></span></div>
    <p id="fict"></p>
    <div id="again"><button class="tape red" id="againB" type="button"></button></div>
  </div>
</div>

/* ---------- Three.js scene ---------- */

function canvasTex(w,h,draw,sRGB=true){
  const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);
  const tx=new THREE.CanvasTexture(c);if(sRGB)tx.encoding=THREE.sRGBEncoding;tx.anisotropy=4;return tx;
}
function noiseFill(g,w,h,base,spread,n){
  g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<n;i++){const v=Math.random()*spread|0;g.fillStyle=`rgba(${v},${v},${v},.5)`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);}
}

/* Sky: stars, a low glow and a mesa line painted directly into one panorama. */
{
 const tx=canvasTex(4096,1024,(g,w,h)=>{

  g.fillStyle=gr;g.fillRect(0,0,w,h*.5);g.fillStyle="#040507";g.fillRect(0,h*.5,w,h*.5);

  for(let i=0;i<900;i++){const x=(w*.3+Math.sin(i*.37)*90+i*.9)%w,y=Math.random()*h*.48;g.fillStyle="rgba(190,200,240,.05)";g.fillRect(x+Math.random()*160,y,3,3);}

 });

/* ---------- Audio: all synthesized ---------- */
const Snd={ctx:null};
function initAudio(){
  if(Snd.ctx)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext,ctx=new C();Snd.ctx=ctx;
    const master=ctx.createGain();master.gain.value=.7;master.connect(ctx.destination);Snd.master=master;
    const noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=noiseBuf.getChannelData(0);
    let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}
    const white=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),wd=white.getChannelData(0);for(let i=0;i<wd.length;i++)wd[i]=Math.random()*2-1;
    Snd.white=white;
    const road=ctx.createBufferSource();road.buffer=noiseBuf;road.loop=true;const rf=ctx.createBiquadFilter();rf.type="lowpass";rf.frequency.value=420;const rg=ctx.createGain();rg.gain.value=0;road.connect(rf);rf.connect(rg);rg.connect(master);road.start();Snd.roadGain=rg;Snd.roadF=rf;
    const o1=ctx.createOscillator(),o2=ctx.createOscillator();o1.type="sawtooth";o2.type="square";const ef=ctx.createBiquadFilter();ef.type="lowpass";ef.frequency.value=160;const eg=ctx.createGain();eg.gain.value=0;o1.connect(ef);o2.connect(ef);ef.connect(eg);eg.connect(master);o1.start();o2.start();Snd.o1=o1;Snd.o2=o2;Snd.engineGain=eg;
    /* Background AM radio: a real track squeezed into a narrow band, with a little static. */
    const rb=ctx.createBiquadFilter();rb.type="bandpass";rb.frequency.value=1300;rb.Q.value=.45;const rv=ctx.createGain();rv.gain.value=0;rb.connect(rv);rv.connect(master);Snd.radioGain=rv;
    const st=ctx.createBufferSource();st.buffer=white;st.loop=true;const sg=ctx.createGain();sg.gain.value=.01;st.connect(sg);sg.connect(rb);st.start();Snd.staticGain=sg;
    Snd.radioIn=rb;Snd.track=Math.floor(Math.random()*RADIO_TRACKS);playRadio();
  }catch(e){Snd.ctx=null;}
}
function playRadio(){
  const c=Snd.ctx,n=Snd.track++%RADIO_TRACKS+1;
  fetch(`radio${n}.mp3`).then(r=>r.arrayBuffer()).then(b=>c.decodeAudioData(b)).then(buf=>{
    const src=c.createBufferSource();src.buffer=buf;src.connect(Snd.radioIn);src.onended=()=>setTimeout(playRadio,2500);src.start();
  }).catch(()=>{});
}
const RADIO_TRACKS=4;
const RADIO_LEVEL=.15;  // overall radio volume; speech ducks it to 40%
function tickRadio(){
  if(!Snd.ctx)return;
  Snd.staticGain.gain.value=.008+Math.max(0,Math.sin(G.time*.31)*Math.sin(G.time*.13))*.03;
  const on=G.phase!=="title"&&G.phase!=="paper";
  Snd.radioGain.gain.setTargetAtTime(on?RADIO_LEVEL*(Voice.speaking?.4:1):0,Snd.ctx.currentTime,.35);
}
function thunk(vol=.5,f=170){if(!Snd.ctx)return;const c=Snd.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(f,c.currentTime);o.frequency.exponentialRampToValueAtTime(50,c.currentTime+.13);g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.connect(g);g.connect(Snd.master);o.start();o.stop(c.currentTime+.2);}
function whoosh(){if(!Snd.ctx)return;const c=Snd.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=Snd.white;f.type="bandpass";f.frequency.setValueAtTime(500,c.currentTime);f.frequency.exponentialRampToValueAtTime(150,c.currentTime+1.1);g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(.3,c.currentTime+.35);g.gain.linearRampToValueAtTime(0,c.currentTime+1.2);s.connect(f);f.connect(g);g.connect(Snd.master);s.start();s.stop(c.currentTime+1.3);}
function updateAudio(){
  if(!Snd.ctx)return;const v=G.speed/90;
  Snd.o1.frequency.value=38+v*72;Snd.o2.frequency.value=38.6+v*72;
  const duck=Voice.speaking?.55:1;
  Snd.engineGain.gain.value=(G.phase==="title"?.03:.05+v*.07)*duck;
  Snd.roadGain.gain.value=v*.34*duck;Snd.roadF.frequency.value=280+v*520;
  Snd.master.gain.value=G.muted?0:.7;
  tickRadio();
}

function freshRide(def){

    log:[],flags:{},fired:{},queue:[],busy:false,turns:0,lastTalk:G.time,silences:0,lieCaught:false,

async function nextPassenger(){
  if(G.i>=G.roster.length){return morning();}

  fade(false);setControls(false);$("hud").dataset.mode="on";
  narrate(L(def.approach),30);
  setChoices([{id:"take",label:{en:t("pickup"),ru:t("pickup")}},{id:"pass",label:{en:t("drivepast"),ru:t("drivepast")}}],id=>{G.approach.decision=id;if(id==="take"){G.target=0;}else{narrate(t("passed"));}});

  follower.visible=false;oncoming.visible=false;figure.visible=false;station.visible=false;sideRoad.visible=false;house.visible=false;
  once.slice().forEach(o=>{if(o!==station&&o!==sideRoad&&o!==house&&o.parent)scene.remove(o);});once.length=0;

  if(b.side){sideRoad.position.z=-230;sideRoad.visible=true;scene.add(sideRoad);if(!once.includes(sideRoad))once.push(sideRoad);}

  else if(id==="gasIn"){gasStop(r);}

  else if(id==="drink"){
    if(G.killer){thunk(.3);fade(true,G.lang==="ru"?"Слишком сладко.\nКрая дороги становятся мягкими.":"It's too sweet.\nThe edges of the road go soft.");G.target=0;setTimeout(()=>{if(G.ride===r)endRide("driver_dead",{silent:true,dead:true});},3200/G.timeScale);}
    else{r.s.trust=clamp(r.s.trust+15,0,100);r.directive="The driver drank your coffee. You're delighted. A few words.";r.beatLine={en:"There now. Isn't that nice.",ru:"Ну вот. Правда хорошо?"};talk({type:"beat"});}
  }

  else if(id==="floor"){endRide("escaped",{turn:{en:"You stomp it. The back door swings open at the washboard.\nYou don't remember the next four miles.",ru:"Ты давишь в пол. На стиральной доске распахивается задняя дверь.\nСледующие четыре мили ты не помнишь."}});}

/* ---------- Extras: pee stops and gas ---------- */

async function peeStop(r){

function peeRefused(r){

  applyReply(r,a,ev);
  r.busy=false;
  if(r.queue.length)pump(r);
}
function showMirrorNote(force){
  const r=G.ride;const n=$("mirrorNote");

/* ---------- Morning ---------- */
async function morning(){
  G.phase="paper";setControls(false);setChoices(null);$("hud").dataset.mode="off";
  fade(true,G.lang==="ru"?"6:00 утра\nСмена окончена":"6:00 AM\nEnd of shift");
  $("items").innerHTML="";$("ledger").hidden=true;$("paperWait").hidden=false;$("again").hidden=true;$("ads").hidden=true;$("fict").hidden=true;
  await wait(2400);
  $("paper").hidden=false;fade(false);
  $("paper").scrollTop=0;
  /* Anyone the night never reached still has a morning. */
  let res=G.results.slice();
  G.roster.forEach(p=>{if(p.id!=="lyle"&&!res.find(x=>x.id===p.id))res.push(makeResult(p.id,"not_taken",null));});
  /* If he learned where you live and was never caught, one more line for the last item. */
  const ly=res.find(x=>x.id==="lyle");
  if(ly&&ly.killer&&ly.key==="killer_later"&&ly.flags.gave_home)ly.facts+=" Separately, a night driver has received an unsigned postcard at his home address: 'Thanks for the ride, friend.'";
  let written=null;
  renderPaper(res,written);
}
function renderPaper(res,written){
  const wrap=$("items");wrap.innerHTML="";$("paperWait").hidden=true;
  const order={today:0,week:1,year:2,late:3};
  res.sort((a,b)=>order[a.when]-order[b.when]).forEach(x=>{
    const w=written&&written.find(i=>i.id===x.id);
    const [h,b]=x[G.lang];
    const el=document.createElement("article");el.className="item"+(x.when==="late"?" late":"");
    const tag=document.createElement("div");tag.className="when";tag.textContent=t(x.when);
    const hd=document.createElement("h3");hd.textContent=w&&w.headline||h;
    const pp=document.createElement("p");pp.textContent=w&&w.body||b;
    el.append(tag,hd,pp);wrap.append(el);
  });
  renderLedger(res);
  $("again").hidden=false;$("ads").hidden=false;$("fict").hidden=false;
}

function renderLedger(res){
  const dead=res.some(x=>x.key==="driver_dead"),won=!dead&&G.cash>=GOAL,k=dead?"dead":won?"win":"short";
  const body=t(k+"B").replace("{cash}",money(G.cash)).replace("{night}",money(G.night)).replace("{left}",money(GOAL-G.cash));
  const box=$("ledger"),h=document.createElement("b");h.textContent=t(k+"H");box.textContent="";box.append(h,body);box.hidden=false;
  $("pDate").textContent=new Date(1973,7,16+G.nightNo).toLocaleDateString(G.lang==="ru"?"ru-RU":"en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  G.over=dead||won;$("againB").textContent=G.over?t("restart"):t("again");
  if(dead)setCash(START);
}

/* ---------- Input ---------- */

function toggleMirror(v){

addEventListener("keydown",e=>{

  if(e.key==="ArrowDown"&&G.ride)$("bSlow").click();
});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let lookX=0,lookY=0;
canvas.addEventListener("pointermove",e=>{lookX=(e.clientX/innerWidth-.5)*2;lookY=(e.clientY/innerHeight-.5)*2;
  mouse.set(lookX,-lookY);ray.setFromCamera(mouse,cam);canvas.style.cursor=G.ride&&ray.intersectObject(mirror).length?"pointer":"default";});
canvas.addEventListener("click",e=>{if(!G.ride)return;mouse.set((e.clientX/innerWidth-.5)*2,-(e.clientY/innerHeight-.5)*2);ray.setFromCamera(mouse,cam);if(G.looking||ray.intersectObject(mirror).length)toggleMirror();});
$("lEn").onclick=()=>{G.lang="en";applyLang();};
$("lRu").onclick=()=>{G.lang="ru";applyLang();};
function playHeaders(){return {"x-play-code":$("code").value.trim()};}
try{$("code").value=localStorage.getItem("lr3am-code")||"";}catch(e){}
/* The hosted game asks for a code, so a leaked link can't spend the voice credits. */
fetch("/api/session?check=1",{headers:playHeaders()}).then(r=>{if(r.status===401)$("codeWrap").hidden=false;}).catch(()=>{});
$("go").onclick=async()=>{
  initAudio();if(Snd.ctx&&Snd.ctx.state==="suspended")Snd.ctx.resume();
  $("codeErr").hidden=true;
  try{
    const res=await fetch("/api/session?check=1",{headers:playHeaders()});
    if(res.status===401){$("codeWrap").hidden=false;$("codeErr").textContent=t("badcode");$("codeErr").hidden=false;$("code").focus();return;}
    try{localStorage.setItem("lr3am-code",$("code").value.trim());}catch(e){}
  }catch(e){}
  Voice.initMic();
  $("title").hidden=true;G.i=0;G.results=[];G.night=0;G.nightNo=0;dealRoster();nextPassenger();
};
$("againB").onclick=()=>{G.nightNo=G.over?0:G.nightNo+1;if(G.over)setCash(START);G.over=false;$("paper").hidden=true;G.i=0;G.results=[];G.night=0;modeNote("");dealRoster();nextPassenger();};
$("bSound").classList.add("on");

/* ---------- Main loop ---------- */
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  cam.aspect=w/h;cam.updateProjectionMatrix();
}
addEventListener("resize",resize);resize();
const lookAtQ=new THREE.Quaternion(),q2=new THREE.Quaternion(),m4=new THREE.Matrix4();
const fwd=new THREE.Vector3();
let lookMix=0,gaugeT=0,oncomingT=8;
function updateWorld(dt){
  const dz=G.speed*.46*dt*(G.dirt?.8:1);
  G.dist+=dz;
  const tx=G.dirt?dirtTex:roadTex;tx.offset.y=(G.dist/(G.dirt?10:14))%1;
  groundTex.offset.y=(G.dist/9.4)%1;
  for(const s of scrollers){
    if(!s.obj.visible&&s.obj!==undefined){s.obj.position.z+=dz;if(s.obj.position.z>30)s.obj.position.z-=s.span;continue;}
    s.obj.position.z+=dz;
    if(s.obj.position.z>30){s.obj.position.z-=s.span;if(s.respawn)s.respawn(s.obj);}
  }
  for(const o of once){if(o.visible)o.position.z+=dz;}
  if(figure.visible)figure.position.z+=dz;
  /* retro-reflectors brighten as the headlights find them */
  /* oncoming traffic: the one moment the back seat is lit */
  if(!G.dirt){
    oncomingT-=dt;
    if(oncomingT<0&&!oncoming.visible&&G.speed>10&&G.phase!=="approach"){oncoming.visible=true;oncoming.position.z=-620;G.passed=false;oncomingT=rand(16,42);}
  }
  sweep.intensity=0;
  if(oncoming.visible){
    oncoming.position.z+=dz+33*dt;
    const z=oncoming.position.z;
    if(z>-120&&z<12){const k=1-Math.abs(z+4)/116;sweep.intensity=k*k*5.2;sweep.position.set(-1.1+clamp(z/60,-1,.3),1.28,-1.2+clamp(z/30,-2.2,.6));}
    if(z>-40&&!G.passed){G.passed=true;whoosh();}
    if(z>60)oncoming.visible=false;
  }
  /* the pickup holds its distance unless you really run */
  if(follower.visible){
    const r=G.ride;
    let goal=r&&r.stage==="husband"?9:58;
    if(G.speed>=84&&r){r.fastMiles+=G.speed/60*dt/MILE;}
    goal+=clamp((G.speed-70),-30,60)*1.4;
    if(r&&r.fastMiles>4&&!r.lost)goal=380;
    follower.position.z=lerp(follower.position.z,goal,1-Math.exp(-dt*.5));
    backLight.intensity=clamp(1-(follower.position.z-8)/110,0,1)*1.4;
    if(follower.position.z>300&&r&&!r.lost){r.lost=true;follower.visible=false;backLight.intensity=0;talk({type:"event",text:"The headlights behind have fallen away and are gone. For now."});}
  }else backLight.intensity=0;
  stationLight.intensity=station.visible?clamp(1-Math.abs(station.position.z)/120,0,1)*1.5:0;
  if(station.visible&&station.position.z>70)station.visible=false;
  sideRoad.visible=sideRoad.visible&&sideRoad.position.z<80;
}
const MILE=7;// real seconds per game mile at 60 mph
function updatePhase(dt){
  const k=1-Math.exp(-dt*(G.target<G.speed?1.5:.7));
  G.speed=lerp(G.speed,G.target,k);if(G.speed<.25&&G.target===0)G.speed=0;
  if(G.phase==="approach"){
    const a=G.approach,z=figure.position.z;
    if(a.decision==="take"){
      G.target=clamp(-z*1.5-4,0,42);
      if(z>-7){G.target=0;}
      if(G.speed<1.5&&G.target===0&&!a.done){a.done=true;board();}
    }else if(z>1&&!a.done){
      a.done=true;
      if(!a.decision)narrate(t("passed"));
      setChoices(null);G.results.push(makeResult(a.def.id,a.def.id==="lyle"?(G.killer=Math.random()<a.def.danger,G.killer?"killer_later":"innocent_later"):"not_taken",null));
      G.i++;setTimeout(nextPassenger,3200/G.timeScale);
    }
  }
  const r=G.ride;
  if(G.phase==="ride"&&r&&!r.ended){
    const dm=G.speed/60*dt/MILE*(r.stage==="dirt"?1.5:1);
    r.miles+=r.stage==="road"?dm:0;
    G.clockMin+=dt*(60/ (r.total*MILE))*1.4;
    if(r.stage==="road"){
      G.fuel=Math.max(0,G.fuel-dm/TANK_MILES);
      if(G.fuel<=0){ranDry(r);return;}
      const free=!r.event&&!$("choices").children.length;
      if(free&&r.pushMile&&r.miles>=r.pushMile)pushStop(r);
      else if(free&&r.peeMile&&r.miles>=r.peeMile&&!(r.def.id==="carol"&&!r.lost))askPee(r);
      else if(free&&r.miles>=1.5&&(G.fuel<.08&&r.gasOffers===1||G.fuel<.22&&!r.gasOffers))offerGas(r);
      if(!r.event)for(const b of r.def.beats){
        if(!r.fired[b.id]&&r.miles>=b.mile&&(!b.when||b.when(r))){fireBeat(r,b);break;}
      }
      if(G.choiceExpire&&r.miles>G.choiceExpire){setChoices(null);if(r.event==="pee")peeRefused(r);else if(r.event==="gas")r.event=null;if(!r.flags.stayed&&r.def.id==="lyle"&&r.fired.turn){onChoice("stay");}}
      if(r.miles>=r.total)arrive(r);
      if(!Voice.live&&G.time-r.lastTalk>30&&r.silences<3&&!r.busy&&G.speed>5){r.silences++;talk({type:"silence"});}
      if(Voice.live&&r.miles-(r.toldMile||0)>=6){r.toldMile=r.miles;Voice.context(`Mile ${r.miles.toFixed(0)} of ${r.total} to ${r.def.dest}. Time ${clockText()}. Speed ${Math.round(G.speed)} mph.`);}
    }
    if(r.stage==="dirt"){
      r.dirtMiles+=dm*2;
      if(r.dirtMiles>1.2&&!r.flags.dirtBeat){r.flags.dirtBeat=true;dirtBeat(r);}
    }
  }
}
function updateCamera(dt,time){
  const narrow=cam.aspect<1.05;
  const look=G.looking;lookMix=lerp(lookMix,look?1:0,1-Math.exp(-dt*5));
  const bumpA=reduced?0:(G.dirt?.012:.0028)*G.speed/60;
  const bx=Math.sin(time*7.3)*bumpA*.6+Math.sin(time*1.1)*.0015,by=Math.sin(time*13.7)*bumpA+Math.cos(time*3.1)*bumpA*.7;
  cam.position.set(narrow?-.12:EYE.x,EYE.y+by,EYE.z);
  cam.position.x+=bx;
  /* straight-ahead pose */
  m4.lookAt(cam.position,tmpA.set(cam.position.x+(narrow?.02:.32)+lookX*.55,cam.position.y+.08-lookY*.22,cam.position.z-4),upV);
  lookAtQ.setFromRotationMatrix(m4);
  /* mirror pose */
  const mirrorWorld=tmpB.copy(MPOS);
  m4.lookAt(cam.position,mirrorWorld,upV);q2.setFromRotationMatrix(m4);
  cam.quaternion.copy(lookAtQ).slerp(q2,lookMix);
  const base=narrow?74:60;
  const fovMirror=narrow?22:17;
  cam.fov=lerp(base,fovMirror,lookMix);cam.updateProjectionMatrix();
}
const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  let dt=Math.min(clock.getDelta(),.05)*G.timeScale;G.time+=dt;
  updatePhase(dt);updateWorld(dt);updatePassenger(dt,G.time);updateCamera(dt,G.time);updateAudio();
  if(subTimer>0){subTimer-=dt;if(subTimer<=0&&G.phase==="ride"){setSubs([]);lastYou="";}}
  gaugeT-=dt;if(gaugeT<0){gaugeT=.2;drawGauge(G.speed);updateStatus();}
  mirror.visible=false;
  renderer.setRenderTarget(mirrorRT);renderer.render(scene,mirrorCam);renderer.setRenderTarget(null);
  mirror.visible=true;
  renderer.render(scene,cam);
}

/* ---------- Boot ---------- */
applyLang();
G.speed=58;G.target=58;
updateStatus();
frame();
window.__nf={G,toggleMirror,setPose,follower,onChoice,Voice};
</script>
